name: Sync BGG collection

on:
  schedule:
    # Daily at 05:17 UTC — off the hour to be polite to BGG's API.
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/sync.yml'

# Pages deployment must not overlap with itself.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write   # commit the refreshed collection + cached covers
  pages: write      # publish to GitHub Pages
  id-token: write   # OIDC token for the Pages deploy

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Choose a collection source
        id: mode
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: |
          if [ -n "$BGG_TOKEN" ]; then
            echo "source=api" >> "$GITHUB_OUTPUT"
          elif [ -f collection.csv ]; then
            echo "source=csv" >> "$GITHUB_OUTPUT"
          else
            echo "source=none" >> "$GITHUB_OUTPUT"
          fi

      # Pushes only ever touch the site itself, so they republish the committed
      # collection rather than querying BGG again.
      # Both importers are continue-on-error: a BGG hiccup must never empty the
      # shelf, it just leaves the last known-good collection in place.
      - name: Sync collection from the BGG XML API
        id: sync
        if: github.event_name != 'push' && steps.mode.outputs.source == 'api'
        continue-on-error: true
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
          BGG_USERNAME: ${{ vars.BGG_USERNAME || 'sirmmo' }}
        run: python scripts/sync_bgg.py

      - name: Import collection from CSV
        id: import
        if: github.event_name != 'push' && steps.mode.outputs.source == 'csv'
        continue-on-error: true
        run: |
          python scripts/import_csv.py collection.csv
          {
            echo "### Shelf built from \`collection.csv\`"
            echo "No \`BGG_TOKEN\` secret is set, so this run used the committed CSV"
            echo "export rather than the live API. The shelf will only change when a"
            echo "fresh CSV is committed. Add the secret for a real daily sync."
          } >> "$GITHUB_STEP_SUMMARY"

      # Links refresh independently of the collection: Board Game Arena adds
      # games, and a new JustPlay pack should reach the shelf without a resync.
      - name: Link playable counterparts
        id: link
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/link_play.py

      - name: Commit refreshed collection
        if: steps.sync.outcome == 'success' || steps.import.outcome == 'success' || steps.link.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/covers
          if git diff --cached --quiet; then
            echo "No collection changes."
          else
            count=$(git diff --cached --name-only | wc -l)
            git commit -m "Sync BGG collection ($count files changed)"
            git push
          fi

      - name: Report sync failure
        if: steps.sync.outcome == 'failure' || steps.import.outcome == 'failure' || steps.mode.outputs.source == 'none'
        run: |
          echo "::warning title=Collection refresh failed::Publishing the last known-good collection instead."
          {
            echo "### ⚠️ Collection refresh failed"
            echo "Source: \`${{ steps.mode.outputs.source }}\`. Publishing the previously committed collection."
            echo "Check that \`BGG_TOKEN\` is set and valid, or that \`collection.csv\` is present."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
